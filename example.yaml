esphome:
  name: "climate-living-room"

esp32:
  board: nodemcu-32s
  framework:
    type: arduino

external_components:
  - source:
      type: git
      url: https://github.com/insipiens/esphome_toshiba_suzumi
    components: [toshiba_suzumi, toshiba_output]

logger:
  level: info

uart:
  id: uart_bus
  tx_pin: 33
  rx_pin: 32
  parity: EVEN
  baud_rate: 9600

climate:
  - platform: toshiba_suzumi
    name: living-room
    id: living_room
    uart_id: uart_bus
    #indoor_temp:        # Optional. Indoor temperature sensor
    #  name: Indoor Temp
    outdoor_temp:        # Optional. Outdoor temperature sensor
      name: Outdoor Temp
    power_select:
      name: "Power level"
    #vertical_air_direction: # Optional. Fixed vertical air direction.
      # Controls the Toshiba horizontal louver, which directs air up/down.
      #name: "Vertical air direction"
    #self_clean:              # Optional. Reports the post-shutdown self-cleaning cycle.
      #name: "Self Clean"
    #horizontal_swing: true # Optional. Uncomment if your HVAC supports also horizontal swing
    #supported_presets:          # Optional. Enable only the features your HVAC
      #- "Standard"
      #- "Hi POWER"
      #- "ECO"
      #- "Fireplace 1"
      #- "Fireplace 2"
      #- "8 degrees"             # When enabling this mode, the temp range is set to 5-30°C
      #- "Silent#1"
      #- "Silent#2"
      #- "Sleep"
      #- "Floor"
      #- "Comfort"
    #disable_wifi_led: true # Optional. Disable Wifi LED on internal unit.
    #energy:
    #  name: "IDU Daily Energy"
    #compressor_load:
    #  name: "IDU Load"
    compressor_current:
      name: "IDU Current"
      id: idu_current
    #odu_discharge_temp:
    #  name: "ODU Discharge Temp"
    #odu_suction_temp:
    #  name: "ODU Suction Temp"
    #odu_heat_exchanger_temp:
    #  name: "ODU Heat Exchanger Temp"
    #idu_heat_exchanger_temp:
    #  name: "IDU Heat Exchanger Temp"
    idu_junction_temp:
      name: "IDU Junction Temp"
      id: idu_branch_temp
    idu_fan_speed:
      name: "IDU Fan Speed"
      id: idu_fan_speed

# Estimate delivered IDU sensible output from Toshiba room temperature,
# branch refrigerant temperature and UART fan value. IDU Current is used only
# as the active-load gate. Coefficients are deliberately configurable so they
# can be refined from measured airflow/temperature tests without changing the
# entity names or dashboards.
toshiba_output:
  climate_id: living_room
  idu_current: idu_current
  branch_temperature: idu_branch_temp
  fan_speed: idu_fan_speed
  cooling_output:
    name: "IDU Cooling Output"
  heating_output:
    name: "IDU Heating Output"
  cooling_coefficient: 2.72   # August 2026 cooling calibration
  heating_coefficient: 3.264  # 2.72 x (4.2 / 3.5); refine from heating test

# Optional read-only focused diagnostic monitor. Normal polling pauses while enabled.
switch:
  - platform: template
    name: "Toshiba focused monitor"
    icon: "mdi:chart-timeline-variant"
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - lambda: |-
          # id(living_room) is the id of the climate component above
          auto* controller = static_cast<toshiba_suzumi::ToshibaClimateUart*>(id(living_room));
          controller->set_scan_enabled(true);
    turn_off_action:
      - lambda: |-
          auto* controller = static_cast<toshiba_suzumi::ToshibaClimateUart*>(id(living_room));
          controller->set_scan_enabled(false);

# Enable Home Assistant API
api:
  encryption:
    key: !secret ha_enc_key

ota:
  password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "A Fallback Hotspot"
    password: "xxxxxxxxxxx"
